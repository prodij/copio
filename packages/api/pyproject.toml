[project]
name = "copio-api"
version = "0.1.0"
description = "Copio API - Velocity, Sync, and Auth services"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.1",
    
    # Auth
    "fastapi-users[sqlalchemy]>=13.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    
    # Background jobs
    "celery[redis]>=5.3.6",
    
    # HTTP client (for channel APIs)
    "httpx>=0.26.0",
    
    # Config
    "pydantic-settings>=2.1.0",
    
    # Channel integrations
    "python-amazon-sp-api>=1.0.0",
    "ShopifyAPI>=12.0.0",
    
    # Utilities
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
    
    # Templating (for emails)
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
