# Template self-test (spec §10): fast tests, then a generated product's `make check`, then (nightly
# or on demand) the generated product's e2e against the real stack and Stripe test mode.
name: template
on:
  pull_request:
  push: {branches: [main]}
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}  # copier clones this repo at HEAD
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: "0.10.2"}
      - run: uv sync --locked
      - run: uv run pytest -q

  generated-check:
    needs: fast
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}  # copier clones this repo at HEAD
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: "0.10.2"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22.23.1"}
      - run: uv sync --locked
      - run: uv run pytest -q -m slow

  generated-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: generated-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults: {run: {working-directory: product}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: template, fetch-depth: 0}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: "0.10.2"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22.23.1"}
      - name: Generate a product
        working-directory: .
        run: |
          uvx copier@9.19.1 copy --trust --defaults --vcs-ref HEAD \
            -d product_name="Acme Reports" -d product_slug=acme-reports template product
      - name: .env with the Stripe test key, then generated values
        env: {STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}"}
        run: |
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "STRIPE_SECRET_KEY must be a Stripe TEST key"; exit 1;; esac
          umask 077 && printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" > .env
          make env
      - run: make up
      - run: make bootstrap
      - run: make e2e
      - if: failure()
        run: docker compose logs --no-color --tail=300 > compose.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          retention-days: 7
          path: |
            product/e2e/playwright-report
            product/e2e/test-results
            product/compose.log
      - if: always()
        run: docker compose down -v
