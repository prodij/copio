services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-copio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python API (unified backend)
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    ports:
      - "8000:8000"   # Python API port
      - "3002:8000"   # Alias for backward compatibility
    environment:
      DATABASE_URL: postgresql+asyncpg://copio:copio_dev@postgres:5432/copio
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${JWT_SECRET:-change-me-in-production-use-openssl-rand-hex-32}
      DEBUG: "true"
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - ./packages/api/alembic:/app/packages/api/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # TypeScript inventory-service (DEPRECATED - kept for reference)
  # To use the old TS service, uncomment this and comment out 'api' above
  # inventory-service:
  #   build:
  #     context: .
  #     dockerfile: packages/inventory-service/Dockerfile.dev
  #   ports:
  #     - "3002:3002"
  #   environment:
  #     DATABASE_URL: postgresql://copio:copio_dev@postgres:5432/copio
  #     REDIS_URL: redis://redis:6379
  #     JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  #     PORT: "3002"
  #     NODE_ENV: development
  #   volumes:
  #     - ./packages/inventory-service/src:/app/packages/inventory-service/src
  #     - ./packages/core/src:/app/packages/core/src
  #     - ./packages/core/prisma:/app/packages/core/prisma
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./packages/web/src:/app/packages/web/src
      - ./packages/web/public:/app/packages/web/public
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
