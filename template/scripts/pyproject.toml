[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "pyyaml>=6.0", "resvg-py>=0.5", "sqlalchemy>=2.0.36", "psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.8", "mypy>=1.13", "types-pyyaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["brand.py", "bootstrap.py", "doctor.py", "make_env.py", "smoke_zitadel.py"]
[[tool.mypy.overrides]]
module = ["resvg_py"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
