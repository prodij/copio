[project]
name = "jobs"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.35", "sqlalchemy>=2.0.36", "psycopg[binary]>=3.2", "httpx>=0.28",
                "croniter>=5.0", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "moto[s3]>=5.0", "ruff>=0.8", "mypy>=1.13", "types-pyyaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["jobs"]
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "croniter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
