# The local-stack scripts (env, bootstrap, brand, doctor) and the agents' guard hook: the rest of `make check`.
name: scripts
on:
  pull_request:
    paths: ["scripts/**", "deploy/**", ".env.example", ".claude/**", ".github/workflows/scripts.yml"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: "0.10.2"}
      - working-directory: scripts
        run: uv sync --locked && uv run ruff check . && uv run mypy && uv run pytest -q
      - name: guard hook
        working-directory: .claude/hooks
        run: uv run --no-project --with pytest pytest -q
