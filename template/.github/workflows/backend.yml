name: backend
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: "0.10.2"}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: openapi.json matches the routes
        run: uv run python -m app.export_openapi && git diff --exit-code -- openapi.json
