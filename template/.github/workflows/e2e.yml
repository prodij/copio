# The e2e tests against the real stack. The sign-up-to-premium test also needs Stripe test mode: the
# repo secret STRIPE_SECRET_KEY (a TEST key, sk_test_...), set by a human; without it that test is
# reported as skipped and the mock payment test runs (not a Stripe pass), unless the repo variable
# STRIPE_E2E_REQUIRED is "true", which fails the run.
# Any other kind of key fails the run. Nothing else is secret here.
name: e2e
on:
  schedule: [{cron: "0 7 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: "0.10.2"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22.23.1", cache: npm, cache-dependency-path: e2e/package-lock.json}
      - name: .env with the Stripe test key if any, then generated values
        env: {STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}", STRIPE_E2E_REQUIRED: "${{ vars.STRIPE_E2E_REQUIRED }}"}
        run: |
          case "$STRIPE_SECRET_KEY" in ""|sk_test_*) ;; *) echo "STRIPE_SECRET_KEY must be a Stripe TEST key"; exit 1;; esac
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            if [ "$STRIPE_E2E_REQUIRED" = "true" ]; then
              echo "::error::No STRIPE_SECRET_KEY secret, and the repo variable STRIPE_E2E_REQUIRED is true"; exit 1
            fi
            echo "::notice::No STRIPE_SECRET_KEY secret: the Stripe e2e payment test will be skipped; the mock payment test runs instead"
            echo "No STRIPE_SECRET_KEY secret: the Stripe e2e payment test is skipped and the mock payment test runs in place of it. A mock payment pass is not a Stripe pass." >> "$GITHUB_STEP_SUMMARY"
          fi
          umask 077 && printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" > .env
          # Explicit, and only with no key (the backend refuses both): prove the webhook path with mock payment.
          if [ -z "$STRIPE_SECRET_KEY" ]; then printf 'BILLING_MODE=mock\nAPP_ENV=local\n' >> .env; fi
          make env
      - run: make up
      - run: make bootstrap
      - run: make e2e
      - if: failure()
        # Scrubbed before upload: Stripe keys, webhook secrets and anything token-shaped (PATs, JWTs).
        run: >-
          docker compose logs --no-color --tail=300
          | sed -E 's/(sk|rk|pk)_(test|live)_[A-Za-z0-9]+/\1_\2_REDACTED/g; s/whsec_[A-Za-z0-9]+/whsec_REDACTED/g;
          s/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_.-]+/JWT_REDACTED/g; s/[A-Za-z0-9_-]{32,}/REDACTED/g' > compose.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          retention-days: 7
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
      - if: always()
        run: docker compose down -v
