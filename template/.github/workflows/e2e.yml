# The sign-up-to-premium test against the real stack and Stripe test mode. Needs the repo secret
# STRIPE_SECRET_KEY (a TEST key, sk_test_...), set by a human; nothing else is secret here.
name: e2e
on:
  schedule: [{cron: "0 7 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: "0.10.2"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22.23.1", cache: npm, cache-dependency-path: e2e/package-lock.json}
      - name: .env with the Stripe test key, then generated values
        env: {STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}"}
        run: |
          case "$STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "STRIPE_SECRET_KEY must be a Stripe TEST key"; exit 1;; esac
          umask 077 && printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" > .env
          make env
      - run: make up
      - run: make bootstrap
      - run: make e2e
      - if: failure()
        run: docker compose logs --no-color --tail=300 > compose.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          retention-days: 7
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
      - if: always()
        run: docker compose down -v
