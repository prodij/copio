name: frontend
on:
  pull_request:
    paths: ["frontend/**", "backend/openapi.json", ".github/workflows/frontend.yml"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22.23.1", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: schema.d.ts matches backend/openapi.json
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
