[project]
name = "copio-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["copier==9.19.1", "pytest>=8.3", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: generates a product and runs its make check"]
addopts = "-m 'not slow'"
