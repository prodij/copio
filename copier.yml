_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Files the product generates, or its own logo. An update never touches these, since a template change
# could only conflict; `make regen` rebuilds the generated ones from the product's own sources.
_skip_if_exists:
  - brand/logo.svg
  - frontend/public/logo.svg
  - frontend/public/favicon.svg
  - frontend/src/brand.css
  - frontend/src/api/schema.d.ts
  - backend/openapi.json

# Runs on copy only (an update must not overwrite a logo the product has since edited, nor fail
# because the source file moved). logo_path is read from where the user's file is, so a relative
# path would resolve against the new product folder: pass an absolute path (or ~/...).
# Tasks need `copier copy --trust`.
_tasks:
  - command:
      - python3
      - -c
      - |
        import os, shutil, sys
        sys.path.insert(0, "scripts")
        from svg_check import svg_problem
        src = os.path.expanduser(sys.argv[1])
        if src:
            if not os.path.isfile(src) or not src.lower().endswith(".svg"):
                sys.exit(f"logo_path {src!r} is not an .svg file (use an absolute path)")
            problem = svg_problem(open(src, errors="replace").read())
            if problem:
                sys.exit(f"logo_path {src!r} {problem}")
            shutil.copyfile(src, "brand/logo.svg")
      - "{% if _copier_operation == 'copy' %}{{ logo_path }}{% endif %}"
  # So the app has the product's colours, logo and title from the first commit, and `make check` passes.
  - command:
      - sh
      - -c
      - cd scripts && uv run --quiet python brand.py --css-only >/dev/null || echo "could not write the brand files; run make regen"
    when: "{{ _copier_operation == 'copy' }}"

product_name:
  type: str
  help: Human name of the product
  validator: >-
    {% if not product_name.strip() or (product_name | regex_search('["\\\\$<>{}`\n\r\t]')) %}cannot be empty or contain a double quote, backslash, dollar sign, angle bracket, curly brace, backtick or line break{% endif %}
product_slug:
  type: str
  help: Lowercase slug, used for databases, buckets and Zitadel project
  default: "{{ product_name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '') }}"
  validator: "{% if not (product_slug | regex_search('^[a-z][a-z0-9-]{1,30}$')) %}lowercase letters, digits and dashes{% endif %}"
domain:
  type: str
  help: Local domain of the stack (milestone 1 runs only on your machine)
  default: "{{ product_slug }}.localhost"
  validator: "{% if not (domain | regex_search('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?[.]localhost$')) %}must end in .localhost: milestone 1 runs only on this machine, and browsers resolve *.localhost to 127.0.0.1 with no DNS or hosts-file setup{% endif %}"
brand_primary:
  type: str
  default: "#2f6bff"
  validator: "{% if not (brand_primary | regex_search('^#[0-9a-fA-F]{6}$')) %}hex colour like #2f6bff{% endif %}"
brand_accent:
  type: str
  default: "#ff7a33"
  validator: "{% if not (brand_accent | regex_search('^#[0-9a-fA-F]{6}$')) %}hex colour like #ff7a33{% endif %}"
brand_font:
  type: str
  help: Font name. It loads only if installed, or with font_file in brand/brand.yaml; otherwise the app uses Inter
  default: Inter
  validator: >-
    {% if not brand_font.strip() or (brand_font | regex_search('["\\\\;{}<>\n\r]')) %}cannot be empty or contain a double quote, backslash, semicolon, angle bracket, curly brace or line break{% endif %}
starter_plan_price_usd:
  type: int
  default: 29
starter_plan_interval:
  type: str
  choices: [month, year]
  default: month
logo_path:
  type: str
  help: Optional absolute path to an SVG logo (copied to brand/logo.svg); leave empty to use the template's brand/logo.svg
  default: ""
  secret: true  # used once on copy, and not kept in .copier-answers.yml: it is a local path with a username
